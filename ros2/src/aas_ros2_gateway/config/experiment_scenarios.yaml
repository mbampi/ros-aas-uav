# Academic Experiment Scenarios

# This allows testing the impact of:
# - Number of topics (message diversity)
# - Message frequency (system load)

# SCENARIO 1
# - Frequency: 2 Hz
# - Topics: 5
# - Total Frequency: 10 Hz

scenario_1:
  namespace: "/px4_1/fmu/out"
  topics:
    battery_status:
      enabled: true
      frequency: 2.0
    vehicle_local_position:
      enabled: true  
      frequency: 2.0
    vehicle_attitude:
      enabled: true
      frequency: 2.0
    vehicle_status:
      enabled: true
      frequency: 2.0
    vehicle_gps_position:
      enabled: true
      frequency: 2.0
    vehicle_global_position:
      enabled: false
      frequency: 2.0

