# MAVROS ROS2 Gateway Configuration
# Setup: Max Load (Tier 1)
# Calculation: Per-Property Load Test
# Total Calculated Load: 63.00 Hz (All 15 properties)

topics_to_properties:
  # --- Low-Frequency Properties (Total 3.80 Hz) ---
  - property: CurrentBatteryLevel
    topic: /mavros/battery
    message_type: sensor_msgs.msg.BatteryState
    field_path: percentage
    data_transform: identity

  - property: FlightStatus
    topic: /mavros/state
    message_type: mavros_msgs.msg.State
    field_path: mode
    data_transform: identity

  - property: Status
    topic: /mavros/state
    message_type: mavros_msgs.msg.State
    field_path: armed
    data_transform: bool_to_armed_string

  - property: SignalStrength
    topic: /mavros/gpsstatus/gps1/raw
    message_type: mavros_msgs.msg.GPSRAW
    field_path: eph
    data_transform: identity

  - property: NumberOfSatellites
    topic: /mavros/gpsstatus/gps1/raw
    message_type: mavros_msgs.msg.GPSRAW
    field_path: satellites_visible
    data_transform: identity

  - property: HorizontalAccuracy
    topic: /mavros/gpsstatus/gps1/raw
    message_type: mavros_msgs.msg.GPSRAW
    field_path: eph
    data_transform: identity

  - property: VerticalAccuracy
    topic: /mavros/gpsstatus/gps1/raw
    message_type: mavros_msgs.msg.GPSRAW
    field_path: epv
    data_transform: identity

  # --- High-Frequency Properties (Total 59.20 Hz) ---
  - property: Altitude
    topic: /mavros/local_position/pose
    message_type: geometry_msgs.msg.PoseStamped
    field_path: pose.position.z
    data_transform: identity

  - property: Pitch
    topic: /mavros/local_position/pose
    message_type: geometry_msgs.msg.PoseStamped
    field_path: pose.orientation
    data_transform: quaternion_to_pitch

  - property: LocalPose
    topic: /mavros/local_position/pose
    message_type: geometry_msgs.msg.PoseStamped
    field_path: pose
    data_transform: position_to_json

  - property: HorizontalSpeed
    topic: /mavros/local_position/velocity_local
    message_type: geometry_msgs.msg.TwistStamped
    field_path: twist.linear
    data_transform: vector_magnitude_2d

  - property: VerticalSpeed
    topic: /mavros/local_position/velocity_local
    message_type: geometry_msgs.msg.TwistStamped
    field_path: twist.linear.z
    data_transform: identity

  - property: GlobalPose
    topic: /mavros/global_position/global
    message_type: sensor_msgs.msg.NavSatFix
    field_path: ""
    data_transform: navsatfix_to_json

  - property: Heading
    topic: /mavros/global_position/compass_hdg
    message_type: std_msgs.msg.Float64
    field_path: data
    data_transform: identity

  - property: FixType
    topic: /mavros/global_position/global
    message_type: sensor_msgs.msg.NavSatFix
    field_path: status.status
    data_transform: navsatfix_status_to_string

# MAVROS enum mappings for transformations
mavros_enums:
  navsatfix_status:
    -1: "NO_FIX"
    0: "FIX_NOT_AVAILABLE"
    1: "GPS_FIX"
    2: "DGPS_FIX"

  mavros_modes:
    "MANUAL": "MANUAL"
    "ACRO": "ACRO"
    "ALTCTL": "ALTITUDE_CONTROL"
    "POSCTL": "POSITION_CONTROL"
    "OFFBOARD": "OFFBOARD"
    "STABILIZED": "STABILIZED"
    "RATTITUDE": "RATTITUDE"
    "AUTO.MISSION": "AUTO_MISSION"
    "AUTO.LOITER": "AUTO_LOITER"
    "AUTO.RTL": "AUTO_RTL"
    "AUTO.LAND": "AUTO_LAND"
    "AUTO.RTGS": "AUTO_RTGS"
    "AUTO.READY": "AUTO_READY"
    "AUTO.TAKEOFF": "AUTO_TAKEOFF"