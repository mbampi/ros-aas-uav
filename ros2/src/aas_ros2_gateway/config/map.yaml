  #  data_transform: navsatfix_status_to_string
    
  # GPS horizontal accuracy
  - property: HorizontalAccuracy
    topic: /mavros/gpsstatus/gps1/raw
    message_type: mavros_msgs.msg.GPSRAW
    field_path: eph
    data_transform: identity
    
  # GPS vertical accuracy
  - property: VerticalAccuracy
    topic: /mavros/gpsstatus/gps1/raw
    message_type: mavros_msgs.msg.GPSRAW
    field_path: epv
    data_transform: identity

# MAVROS enum mappings for transformations
mavros_enums:
  navsatfix_status:
    -1: "NO_FIX"
    0: "FIX_NOT_AVAILABLE"
    1: "GPS_FIX"
    2: "DGPS_FIX"
    
  mavros_modes:
    "MANUAL": "MANUAL"
    "ACRO": "ACRO"
    "ALTCTL": "ALTITUDE_CONTROL"
    "POSCTL": "POSITION_CONTROL"
    "OFFBOARD": "OFFBOARD"
    "STABILIZED": "STABILIZED"
    "RATTITUDE": "RATTITUDE"
    "AUTO.MISSION": "AUTO_MISSION"
    "AUTO.LOITER": "AUTO_LOITER"
    "AUTO.RTL": "AUTO_RTL"
    "AUTO.LAND": "AUTO_LAND"
    "AUTO.RTGS": "AUTO_RTGS"
    "AUTO.READY": "AUTO_READY"
    "AUTO.TAKEOFF": "AUTO_TAKEOFF"
