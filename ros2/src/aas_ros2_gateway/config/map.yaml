  #   field_path: pose.position
  #   data_transform: position_to_json
    
  # # Horizontal speed from local position velocities
  # - property: HorizontalSpeed
  #   topic: /mavros/local_position/velocity_local
  #   message_type: geometry_msgs.msg.TwistStamped
  #   field_path: twist.linear
  #   data_transform: vector_magnitude_2d
    
  # # Vertical speed from local position
  # - property: VerticalSpeed
  #   topic: /mavros/local_position/velocity_local
  #   message_type: geometry_msgs.msg.TwistStamped
  #   field_path: twist.linear.z
  #   data_transform: identity
    
  # # GPS Global position and heading
  # - property: GlobalPose
  #   topic: /mavros/global_position/global
  #   message_type: sensor_msgs.msg.NavSatFix
  #   field_path: ""
