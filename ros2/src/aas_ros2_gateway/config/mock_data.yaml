  - topic: "signal_frequency"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "height_unfolded"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "height_folded"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "width_unfolded"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "width_folded"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "length_unfolded"
    frequency: 10 # Hz
