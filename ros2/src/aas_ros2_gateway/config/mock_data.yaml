# Configuration for the mock publisher to generate random integer data.
# 15 topics with specified frequency and value ranges.
# This configuration is used to simulate data for testing purposes.
# Each topic will publish random integer values within the specified range
# Total Hz = 150 Hz (10 Hz per topic)

publishers:
  - topic: "horizontal_speed"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "vertical_speed"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "battery"
    frequency: 10 # Hz
    data_type: "sequential"

  - topic: "altitude"
