services:
  aas_gateway:
    container_name: aas_gateway
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "source /ros2_ws/install/setup.bash && \
        ros2 launch aas_ros2_gateway aas_gateway.launch.py 2>&1 | tee /logs/aas_gateway.log"
    volumes:
      - ./logs/aas_gateway:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 4GB of RAM and 4 CPU cores - simulating a weak Companion Board
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'

  mock_publisher:
    container_name: mock_publisher
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "source /ros2_ws/install/setup.bash && 
        ros2 run aas_ros2_gateway mock_publisher"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aas_gateway
    profiles:
      - mock

  resource_monitor:
    image: docker:latest
    container_name: resource_monitor
    command: >
      sh -c '
        while true; do
          TIMESTAMP=$$(date -u +%Y-%m-%dT%H:%M:%SZ);
          STATS_JSON=$$(docker stats --no-stream --format "{{json .}}" aas_gateway);
          echo "{\"timestamp\":\"$$TIMESTAMP\", \"stats\":$$STATS_JSON}" >> /logs/resource_usage.log;
          sleep 1;
        done
      '
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/resource_monitor:/logs
    depends_on:
      - aas_gateway