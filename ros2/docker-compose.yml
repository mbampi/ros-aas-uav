services:
  aas_gateway:
    container_name: aas_gateway
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "source /ros2_ws/install/setup.bash && \
        ros2 launch aas_ros2_gateway aas_gateway.launch.py 2>&1 | tee /logs/aas_gateway.log"
    volumes:
      - ./logs/aas_gateway:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host" 
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'

  mavros:
    build:
      context: .
      dockerfile: Dockerfile.mavros
    container_name: mavros
    ports:
      - "14550:14550/udp"
      # - "/dev/ttyAMA0:/dev/ttyAMA0" # Example for serial device (UART)
    command: >
      bash -c "source /opt/ros/humble/setup.bash && 
        ros2 run mavros mavros_node --ros-args -p fcu_url:=udp://:14550@ -p tgt_system:=2 -p conn_debug:=true --log-level mavros:=DEBUG"

