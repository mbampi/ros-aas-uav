  resource_monitor:
    image: alpine:latest
    container_name: resource_monitor
    pid: "host"
    command: >
      sh -c '
        apk add --no-cache sysstat procps coreutils;
        
        echo "Looking for aas_gateway process...";
        while ! pgrep -f "aas_gateway" > /dev/null; do sleep 1; done;
        
        GATEWAY_PID=$$(pgrep -f "aas_gateway" | grep -v "bash" | head -n 1);
        echo "Found gateway at PID: $$GATEWAY_PID. Starting 1Hz monitor.";
        
        stdbuf -oL pidstat -p $$GATEWAY_PID -u -r -h 1 >> /logs/native_resource_usage.log 2>&1;
      '
    volumes:
      - ./logs/resource_monitor:/logs
    depends_on:
      - aas_gateway